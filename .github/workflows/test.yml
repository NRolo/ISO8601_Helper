# This workflow will Test the Project

name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  PROJECT_NAME: ISO8601_Helper 
  PRODUCT_NAME: ISO8601_Helper           

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_NAME }}.UnitTests/${{ env.PROJECT_NAME }}.UnitTests.csproj

      - name: Run tests
        run: |
          dotnet test ${{ env.PROJECT_NAME }}.UnitTests/${{ env.PROJECT_NAME }}.UnitTests.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Write coverage to summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
